  <title>Weekly KPIs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500&family=Permanent+Marker&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="novus-styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="novus-core.js"></script>
  <script>
    // ── Multi-plant config ──────────────────────────────────────────────
    // Play Call is scoped per plant (see plant_scoped_boards.sql) -- this
    // resolves which plant is active the same way dds-dashboard.html and
    // hub.html do: URL ?plant=, then the last plant chosen in this
    // browser, then the plant in plant-config.js (one plant per deployment).
    // Plant list comes from plant-config.js (one plant per deployment).
    async function resolveActivePlant(){
      const config = await window.PLANTS_CONFIG_PROMISE;
      const plants = config.plants || [];
      const urlId = new URLSearchParams(location.search).get('plant');
      let storedId = null;
      try { storedId = localStorage.getItem('novus_active_plant'); } catch(_) {}
      const wantId = urlId || storedId;
      const plant = plants.find(p => p.id === wantId) || plants[0];
      window.PLANTS_CONFIG = config;
      window.ACTIVE_PLANT = plant;
      try { localStorage.setItem('novus_active_plant', plant.id); } catch(_) {}
      return plant;
    }

    function applyPlantBranding(plant){
      document.title = 'Weekly KPIs – ' + plant.name;
      const tag = document.getElementById('plant-tag');
      if(tag) tag.textContent = plant.shortLabel || plant.name;
    }
  </script>
  <style>
    html, body { height:100%; }
    body { display:flex; flex-direction:column; }
    .kpi-wrap { flex:1; min-height:0; display:flex; flex-direction:column; }
    .kpi-strip { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 22px 10px; }
    .kpi-strip h1 { font-size:1.6rem; font-weight:800; color:var(--ink); letter-spacing:-.04em; display:flex; align-items:center; }
    .plant-tag { font-size:.72rem; font-weight:700; color:var(--green-d); background:var(--green-xll); border:1px solid var(--green-ll); padding:3px 10px; border-radius:20px; margin-left:12px; }
    .kpi-sub { font-size:.78rem; color:var(--ink3); }
    .kpi-frame { flex:1; min-height:0; width:100%; border:0; border-top:1px solid var(--border); background:var(--bg); display:block; }
    @media (max-width:640px) { .kpi-strip { padding:10px 16px 8px; } .kpi-sub { display:none; } }
  </style>
</head>
<body>

</header>


<div class="kpi-wrap">
  <div class="kpi-strip">
    <h1>Weekly KPIs<span class="plant-tag" id="plant-tag"></span></h1>
    <div class="kpi-sub">Build boards, compare metrics side by side, and use Present for the staff meeting.</div>
  </div>
  <iframe id="kpi-frame" class="kpi-frame" title="Weekly KPI boards" allow="fullscreen; clipboard-write" src="about:blank"></iframe>
</div>
<script>
  window.addEventListener('load', async () => {
    NovusCore.requireAuth();
    const plant = await resolveActivePlant();
    applyPlantBranding(plant);
    document.getElementById('kpi-frame').src = 'kpi-boards.html?embed=1&plant=' + encodeURIComponent(plant.id);
  });
</script>
<script src="novus-interactions.js" defer></script>
