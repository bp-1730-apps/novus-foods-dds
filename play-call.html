<!DOCTYPE html>
<html lang="en">
<head>
  <script src="plant-config.js"></script>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Play Call</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500&family=Permanent+Marker&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="novus-styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="novus-core.js"></script>
  <script>
    // ── Multi-plant config ──────────────────────────────────────────────
    // Play Call is scoped per plant (see plant_scoped_boards.sql) -- this
    // resolves which plant is active the same way dds-dashboard.html and
    // hub.html do: URL ?plant=, then the last plant chosen in this
    // browser, then the plant in plant-config.js (one plant per deployment).
    // Plant list comes from plant-config.js (one plant per deployment).
    async function resolveActivePlant(){
      const config = await window.PLANTS_CONFIG_PROMISE;
      const plants = config.plants || [];
      const urlId = new URLSearchParams(location.search).get('plant');
      let storedId = null;
      try { storedId = localStorage.getItem('novus_active_plant'); } catch(_) {}
      const wantId = urlId || storedId;
      const plant = plants.find(p => p.id === wantId) || plants[0];
      window.PLANTS_CONFIG = config;
      window.ACTIVE_PLANT = plant;
      try { localStorage.setItem('novus_active_plant', plant.id); } catch(_) {}
      return plant;
    }

    function applyPlantBranding(plant){
      document.title = 'Play Call – ' + plant.name;
      const tag = document.getElementById('plant-tag');
      if(tag) tag.textContent = plant.shortLabel || plant.name;
    }
  </script>
  <style>
    .page { padding-top:24px; }
    .page-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:28px; }
    .page-title { font-size:2rem; font-weight:800; color:var(--ink); letter-spacing:-.04em; }
    .plant-tag  { font-size:.72rem; font-weight:700; color:var(--green-d); background:var(--green-xll); border:1px solid var(--green-ll); padding:3px 10px; border-radius:20px; margin-left:12px; vertical-align:middle; }
    .sync-meta  { font-size:.72rem; font-family:'DM Mono',monospace; color:var(--ink4); display:flex; align-items:center; gap:10px; }

    .playcall-grid { grid-column: 1 / -1; }

    /* Manager panel */
    .manager-panel {
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--radius); overflow:hidden;
      box-shadow:var(--shadow-sm);
      display:flex; flex-direction:column;
      transition:box-shadow .2s,border-color .2s;
    }
    .manager-panel:hover { box-shadow:var(--shadow); border-color:var(--green-ll); }

    .manager-header {
      background:linear-gradient(135deg,var(--green-xll),var(--green-ll));
      border-bottom:1.5px solid #a7f3d0;
      padding:11px 18px;
    }
    .manager-name { text-align: center; font-weight:800; font-size:.95rem; color:var(--green-d); }

    .task-input-wrap { padding:11px 14px; background:var(--surface2); border-bottom:1px solid var(--border); }
    .task-input {
      width:100%; padding:10px 14px;
      border:1.5px solid var(--border); border-radius:var(--radius-sm);
      font-family:inherit; font-size:.88rem; color:var(--ink);
      background:var(--surface); outline:none;
      transition:border-color .15s,box-shadow .15s;
    }
    .task-input:focus { border-color:var(--green); box-shadow:0 0 0 3px var(--green-glow); }

    .task-list { padding:6px 0; min-height:70px; display:flex; flex-direction:column; }
    .empty-state { flex:1; display:flex; align-items:center; justify-content:center; padding:20px; text-align:center; color:var(--ink4); font-size:.82rem; font-style:italic; }

    .task-item {
      display:flex; align-items:flex-start; gap:12px;
      padding:12px 16px; border-bottom:1px solid var(--border);
      transition:all .35s var(--ease); background:var(--surface);
    }
    .task-item:last-child { border-bottom:none; }
    .task-item:hover { background:var(--green-xll); }
    .task-item.removing { opacity:0; transform:translateX(30px); }

    .checkbox-btn {
      width:22px; height:22px; border-radius:6px;
      border:2px solid var(--border2);
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      flex-shrink:0; background:var(--surface);
      transition:border-color .15s,background .15s;
    }
    .checkbox-btn:hover { border-color:var(--green); background:var(--green-xll); }
    .checkbox-btn svg { width:13px; height:13px; fill:none; stroke:var(--green-d); stroke-width:3; }

    .task-text { font-size:.9rem; color:var(--ink2); line-height:1.5; flex:1; font-weight:500; }
  </style>
</head>
<body>
<!-- ══ COMMAND CENTER HEADER ══════════════════════════════════════════════ -->

    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    Hub
    </a>
    <a href="dds-announcements.html">
      <img data-brand-logo alt="" class="cmd-logo">
    </a>
    <div class="cmd-divider"></div>
        <nav class="cmd-nav">
      <a class="cmd-tab" href="dds-announcements.html">Announcements</a>
      <a class="cmd-tab" href="dds-dashboard.html">Dashboard</a>
      <a class="cmd-tab" href="weekly-kpis.html">Weekly KPIs</a>

      <a class="cmd-tab" href="data-entry.html">Data Entry</a>

  <div class="cmd-right">

    <div class="cmd-more-wrap" id="more-wrap">

      </button>
      <div class="more-dropdown hidden" id="more-dropdown">
        <div class="sd-group-label">Quick Access</div>

          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>

          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>

          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>

        </button>

          Maintenance

        <div class="sd-divider"></div>
        <div class="sd-group-label">Session</div>

          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Logout
        </button>
      </div>
    </div>
  </div>
</header>


<div class="page">
  <div class="page-top">
    <h1 class="page-title">Daily Play Call<span class="plant-tag" id="plant-tag"></span></h1>
    <div class="sync-meta">
      <span id="sync-status">Connecting…</span>
      <button class="btn btn-ghost" style="font-size:.72rem;padding:5px 11px;" onclick="fetchData()">↺ Refresh</button>
    </div>
  </div>
  <div class="playcall-grid" id="main-grid"></div>
</div>

<script>
  const MANAGERS=[
    {name:'Play Call | Winning the Day',webhook:''}
    ];

  let taskData=[];

  function initGrid(){
    document.getElementById('main-grid').innerHTML=MANAGERS.map(mgr=>{
      const sid=mgr.name.replace(/\s+/g,'');
      return`<div class="manager-panel">
        <div class="manager-header"><div class="manager-name">${mgr.name}</div></div>
        <div class="task-input-wrap">
          <input type="text" class="task-input" id="input-${sid}" placeholder="Assign a play…" onkeydown="if(event.key==='Enter')addTask('${mgr.name}',this)">
        </div>
        <div class="task-list" id="list-${sid}"><div class="empty-state">Loading plays…</div></div>
      </div>`;
    }).join('');
  }

  function render(){
    MANAGERS.forEach(mgr=>{
      const sid=mgr.name.replace(/\s+/g,'');
      const container=document.getElementById(`list-${sid}`);if(!container)return;
      const mgrTasks=taskData.filter(t=>t.owner===mgr.name);
      if(!mgrTasks.length){container.innerHTML='<div class="empty-state">No active plays.</div>';return;}
      container.innerHTML=mgrTasks.map(task=>`
        <div class="task-item" id="task-${task.id}">
          <button class="checkbox-btn" onclick="completeTask('${task.id}',this)" title="Mark complete">
            <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          </button>
          <div class="task-text">${task.text}</div>
        </div>`).join('');
    });
  }

  // Namespaced per plant so switching plants never flashes another
  // plant's cached plays before fetchData() below overwrites it.
  function playCallCacheKey(){return 'novus_playcall_cache_'+((window.ACTIVE_PLANT&&window.ACTIVE_PLANT.id)||'default');}

  async function fetchData(){
    const status=document.getElementById('sync-status');status.textContent='Syncing…';
    const{data,error}=await NovusDB.playCall.getAll(window.ACTIVE_PLANT&&window.ACTIVE_PLANT.id);
    if(error){status.textContent='Error';console.error(error);return;}
    taskData=data||[];
    try{localStorage.setItem(playCallCacheKey(),JSON.stringify(taskData));}catch(_){}
    render();
    status.textContent=`Synced ${new Date().toLocaleTimeString()}`;
  }

  async function addTask(managerName,input){
    const text=input.value.trim();if(!text)return;
    if(!window.ACTIVE_PLANT){alert('No active plant resolved yet — reload and try again.');return;}
    const mgr=MANAGERS.find(m=>m.name===managerName);
    const id=Date.now().toString();
    input.value='';
    taskData.push({id,owner:managerName,text});render();
    const{error}=await NovusDB.playCall.add({id,plant_id:window.ACTIVE_PLANT.id,owner:managerName,text,webhook:mgr?.webhook||'',date:new Date().toLocaleString()});
    if(error){console.error(error);taskData=taskData.filter(t=>t.id!==id);render();}
    else if(mgr?.webhook)fetch(mgr.webhook,{method:'POST',mode:'no-cors',body:JSON.stringify({task:text,owner:managerName})}).catch(()=>{});
  }

  async function completeTask(id,btn){
    const row=document.getElementById(`task-${id}`);
    if(row){btn.style.background='var(--green-ll)';btn.style.borderColor='var(--green)';row.classList.add('removing');setTimeout(()=>{taskData=taskData.filter(t=>t.id!==id);render();},380);}
    await NovusDB.playCall.delete(id);
  }

  window.onload=async()=>{
    NovusCore.requireAuth();initGrid();
    const plant=await resolveActivePlant();
    applyPlantBranding(plant);
    try{const c=localStorage.getItem(playCallCacheKey());if(c){taskData=JSON.parse(c);render();}}catch(_){}
    fetchData();
    NovusDB.playCall.subscribe(()=>fetchData());
  };
</script>
<script src="novus-interactions.js" defer></script>
</body>
</html>
